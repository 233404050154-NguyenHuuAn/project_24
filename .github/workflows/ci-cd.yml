name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov=validators --cov-report=term-missing --cov-report=html
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  deploy:
    name: Deploy (Render)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Gọi Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null
      - name: Smoke test
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          expected=$(grep -oP 'APP_VERSION = "\K[^"]+' app.py)
          for i in $(seq 1 40); do
            actual=$(curl --silent --max-time 20 "$APP_URL/health" | jq -r '.version // empty' || true)
            echo "Lần $i: mong đợi $expected, nhận được '${actual}'"
            if [ "$actual" = "$expected" ]; then
              code=$(curl --silent --max-time 20 -o /dev/null -w '%{http_code}' "$APP_URL/")
              echo "Trang chủ trả HTTP $code"
              [ "$code" = "200" ] && exit 0
              echo "Trang chủ phải trả 200"
              exit 1
            fi
            sleep 15
          done
          echo "Hết thời gian chờ: web chưa chạy phiên bản $expected"
          exit 1
